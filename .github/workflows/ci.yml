name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rules (architecture verification)
        run: pnpm depcruise

      - name: Build
        run: pnpm build

      - name: Test (unit, property, failure, golden)
        run: pnpm test

      - name: Benchmarks (perf budgets are tests)
        run: pnpm bench
