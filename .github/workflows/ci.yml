name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency rules (architecture verification)
        run: pnpm depcruise

      - name: Build
        run: pnpm build

      - name: Test (unit, property, failure, golden)
        run: pnpm test

      - name: Install software-rendered Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser UI, interaction, FPS, and heap gates
        env:
          MERIDIAN_PHASE11_BENCH: "1"
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-playwright
          path: |
            apps/studio/playwright-report/
            apps/studio/test-results/
          if-no-files-found: ignore

      - name: Benchmarks (perf budgets are tests)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          MERIDIAN_BENCH_RUNNER_CLASS: github-actions-ubuntu-24.04-x64-node-24
          MERIDIAN_BENCH_REQUIRE_RUNNER: "1"
          MERIDIAN_BENCH_REQUIRE_EXTERNAL: "1"
          MERIDIAN_BENCH_REQUIRE_ALL: "1"
        run: pnpm bench

      - name: Upload benchmark dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-dashboard
          path: benchmarks/results/
          if-no-files-found: error
